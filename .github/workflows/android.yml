name: build

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wikimind-apk:
    name: WikiMind assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-rn-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-rn-${{ runner.os }}-

      - name: Install npm dependencies
        run: npm ci

      - name: Verify environment
        run: |
          echo "Node: $(node --version)"
          echo "Java: $(java -version 2>&1 | head -1)"
          echo "ANDROID_HOME: $ANDROID_HOME"
          ls $ANDROID_HOME/platforms/ || echo "no platforms"
          ls $ANDROID_HOME/build-tools/ || echo "no build-tools"
          ls $ANDROID_HOME/ndk/ || echo "no ndk"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Assemble debug APK
        run: |
          cd android
          ./gradlew :app:assembleDebug --no-daemon 2>&1 | tee /tmp/build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo ""
            echo "========== KOTLIN COMPILE ERRORS =========="
            grep -n "error:" /tmp/build.log | head -60
            echo ""
            echo "========== LINES AROUND compileDebugKotlin =========="
            grep -n "compileDebugKotlin\|\.kt:" /tmp/build.log | head -60
            echo "========== END =========="
          fi
          exit $BUILD_EXIT
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: /tmp/build.log
          retention-days: 3

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wikimind-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
