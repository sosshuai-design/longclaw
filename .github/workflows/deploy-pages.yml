name: Deploy 恐龙数学岛 to GitHub Pages

# 用 GitHub 官方 Actions 部署（upload-pages-artifact + deploy-pages）。
#
# 一次性前置（必须由仓库管理员在网页上做，自动 token 没权限代办）：
#   Settings → Pages → Build and deployment → Source 选 "GitHub Actions"
# 之后本工作流每次推送自动构建并部署。
# 站点地址：https://sosshuai-design.github.io/longclaw/

on:
  push:
    branches: [claude/infant-math-learning-tool-h6fjm4]
    paths:
      - "dino-math-island/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & build
        working-directory: dino-math-island
        env:
          VITE_BASE: /longclaw/ # 项目站点子路径
        run: |
          npm ci
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dino-math-island/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

