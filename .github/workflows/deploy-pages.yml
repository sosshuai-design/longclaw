name: Deploy 恐龙数学岛 to GitHub Pages

# 用 GitHub 官方 Pages 部署（actions/configure-pages + upload-pages-artifact + deploy-pages）。
# configure-pages 的 enablement:true 会通过 API 直接把 Pages 启用并设为 "GitHub Actions" 模式，
# 绕开"从分支构建(legacy)"那套在本仓库上 404 的旧部署器。
# 站点地址：https://sosshuai-design.github.io/longclaw/

on:
  push:
    branches: [claude/infant-math-learning-tool-h6fjm4]
    paths:
      - "dino-math-island/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Pages (enable + 设为 Actions 模式)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install & build
        working-directory: dino-math-island
        env:
          VITE_BASE: /longclaw/ # 项目站点子路径
        run: |
          npm ci
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dino-math-island/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
